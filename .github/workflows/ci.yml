name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Test and build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Sim self-checks
        run: npm test
      - name: Typecheck and build
        run: npm run build
      - name: Upload build
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t x5-commander .
      - name: Smoke test
        run: |
          docker run -d --name x5 -p 8080:8080 x5-commander
          for i in $(seq 30); do curl -sf localhost:8080/healthz && break; sleep 1; done
          curl -sf localhost:8080/ | grep -q '<title>X5 Commander'
          curl -sf -c jar -X POST -H 'Content-Type: application/json' -d '{"name":"CI-BOT","password":"ci-password"}' localhost:8080/api/signup
          curl -sf -b jar -X POST -H 'Content-Type: application/json' -d '{"time":60,"kills":10,"level":1,"earned":100}' localhost:8080/api/scores | grep -q '"rank":1'
          curl -sf -b jar localhost:8080/api/me | grep -q '"name":"CI-BOT"'
          docker stop x5 && docker logs x5

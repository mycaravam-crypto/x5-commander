name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "server/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "deploy/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

# One deploy at a time, and never cancel one halfway through.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.X5_DOMAIN && format('https://{0}', vars.X5_DOMAIN) || '' }}
    steps:
      # Until the secrets are set (see deploy/Caddyfile and the README), a push skips instead of failing; a deploy run by
      # hand fails, so a skipped deploy never looks like a green one.
      - name: Check deploy secrets
        id: ready
        env:
          KEY: ${{ secrets.X5_DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.X5_DEPLOY_HOST }}
        run: |
          if [ -n "$KEY" ] && [ -n "$HOST" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::X5_DEPLOY_SSH_KEY / X5_DEPLOY_HOST not set: nothing to deploy with"; exit 1
          else echo "::warning::X5_DEPLOY_SSH_KEY / X5_DEPLOY_HOST not set: skipping deploy"; fi

      - uses: actions/checkout@v4
        if: steps.ready.outputs.ok

      - uses: actions/setup-node@v4
        if: steps.ready.outputs.ok
        with:
          node-version: 22
          cache: npm

      - uses: webfactory/ssh-agent@v0.9.0
        if: steps.ready.outputs.ok
        with:
          ssh-private-key: ${{ secrets.X5_DEPLOY_SSH_KEY }}

      - name: Trust server host key
        if: steps.ready.outputs.ok
        env:
          X5_DEPLOY_HOST: ${{ secrets.X5_DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${X5_DEPLOY_HOST#*@}" >> ~/.ssh/known_hosts

      - name: Deploy
        if: steps.ready.outputs.ok
        env:
          X5_DEPLOY_HOST: ${{ secrets.X5_DEPLOY_HOST }}
          X5_DEPLOY_PATH: ${{ secrets.X5_DEPLOY_PATH }}
          X5_DOMAIN: ${{ vars.X5_DOMAIN }}
        run: ./deploy/deploy.sh

      - name: Check the live site
        if: steps.ready.outputs.ok
        env:
          X5_DOMAIN: ${{ vars.X5_DOMAIN }}
        run: |
          if [ -z "$X5_DOMAIN" ]; then echo "::warning::X5_DOMAIN variable not set: skipping the live site check"; exit 0; fi
          for i in $(seq 10); do curl -sf "https://$X5_DOMAIN/healthz" && exit 0; sleep 3; done
          echo "::error::https://$X5_DOMAIN/healthz isn't answering (DNS or the Caddy block missing?)"; exit 1

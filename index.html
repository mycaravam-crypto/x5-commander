<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>X5 Commander</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="hud">
    <div id="labels"></div>
    <div id="top" class="frame">
      <div class="stat"><small>CREDITS</small><b id="credits" class="hot">0</b></div>
      <div class="stat"><small>PHASE</small><b id="phase">1</b></div>
      <div class="stat"><small>TIME</small><b id="time">0:00</b></div>
      <div class="stat"><small>KILLS</small><b id="kills">0</b></div>
      <div class="stat"><small>BATTERY LV</small><b id="level">1</b></div>
      <div id="combo"></div>
    </div>
    <div id="left" class="frame">
      <div class="bar"><small>BATTERY <span id="hpTxt"></span></small><b id="hpBar" class="seg"></b></div>
      <div class="bar"><small>POWER <span id="pwTxt"></span></small><b id="pwBar" class="seg"></b></div>
      <div class="bar"><small>INTERCEPTORS <span id="amTxt"></span></small><b id="amBar" class="seg"></b></div>
      <dl id="info"></dl>
      <canvas id="radar" width="220" height="220"></canvas>
    </div>
    <div id="shop" class="frame"></div>
    <div id="bottom"><div id="target" class="frame"></div><div id="log" class="frame"></div></div>
    <div id="help">LMB priority target · Space intercept · G fire discipline · T mode · F EMCON · X 2× speed · wheel zoom · RMB/Q/E rotate · P pause · D daily op · M mute · Tab shop</div>
    <div id="tip" class="frame"></div>
    <div id="touch"><button data-k="Tab">SHOP</button><button data-k="Space">INTCPT</button><button data-k="KeyG">FIRE</button><button data-k="KeyF">EMCON</button><button data-k="KeyT">MODE</button><button data-k="KeyX">2×</button><button data-k="KeyP">PAUSE</button></div>
    <div id="popups"></div>
    <div id="banner"></div>
    <div id="overlay"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>

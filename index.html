<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>X5 Commander</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="hud">
    <div id="top">
      <div class="stat"><small>CREDITS</small><b id="credits" class="y">0</b></div>
      <div class="stat"><small>PHASE</small><b id="phase">1</b></div>
      <div class="stat"><small>TIME</small><b id="time">0:00</b></div>
      <div class="stat"><small>KILLS</small><b id="kills">0</b></div>
      <div class="stat"><small>BASE LV</small><b id="level">1</b></div>
      <div id="combo"></div>
    </div>
    <div id="left">
      <div class="bar"><small>BASE <span id="hpTxt"></span></small><i><u id="hpBar"></u></i></div>
      <div class="bar"><small>POWER <span id="pwTxt"></span></small><i><u id="pwBar" class="pw"></u></i></div>
      <div class="bar"><small>AMMO <span id="amTxt"></span></small><i><u id="amBar" class="am"></u></i></div>
      <dl id="info"></dl>
      <canvas id="radar" width="220" height="220"></canvas>
    </div>
    <div id="shop"></div>
    <div id="help">LMB mark target · T mode · wheel zoom · RMB/Q/E rotate · P pause · M mute · Tab shop</div>
    <div id="popups"></div>
    <div id="banner"></div>
    <div id="overlay"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
